# One host, path prefixes. See spec/SPEC-ingress.md. The port is fixed:
# the buildpack's {{port}} is the PORT variable, which the image does not set.
# Built and published by ci-ingress.yml alone (AVARC-52).
worker_processes 1;
daemon off;
error_log stderr;

events {
    worker_connections 1024;
}

http {
    charset utf-8;

    # Request ID (spec/SPEC-observability.md): created here for every request;
    # a value from a trusted hop is kept, from anywhere else it is replaced.
    # nginx's own $request_id is the generated value.
    map "$trusted:$http_x_request_id" $req_id {
        default $request_id;
        "~^1:(?<rid>[A-Za-z0-9._-]{8,64})$" $rid;
    }

    # One JSON object per line. The path without the query string, because
    # the query can carry login codes; no cookies, no authorization header.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","service":"ingress",'
        '"request_id":"$req_id","message":"$request_method $uri $status",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream_duration":"$upstream_response_time"}';
    access_log /dev/stdout json;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;

    # The upstreams are the services of the Compose project. They are looked
    # up per request (Docker's resolver), so that a restarted service is found
    # again and nginx starts even if one of them is not up yet.
    resolver 127.0.0.11 valid=10s;

    # TLS is terminated before the ingress (see spec/SPEC-deployment.md), so
    # the forwarded headers of private-range hops are trusted and passed on
    # for the upstreams to see the original scheme and host; from anywhere
    # else they are replaced.
    geo $trusted {
        default 0;
        127.0.0.0/8 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
        ::1 1;
        fc00::/7 1;
    }
    map "$trusted:$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        "~^1:(?<proto>https?)$" $proto;
    }
    map "$trusted:$http_x_forwarded_host" $forwarded_host {
        default $http_host;
        "~^1:(?<fhost>.+)$" $fhost;
    }
    map $trusted $forwarded_for {
        default $remote_addr;
        1 $proxy_add_x_forwarded_for;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Id $req_id;
    add_header X-Request-Id $req_id always;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Metrics for the exporter of the Compose project; this port is not
    # published and the public server below does not route to it.
    server {
        listen 8081;
        access_log off;
        location = /stub_status {
            stub_status;
        }
    }

    server {
        listen 8080;

        # Without a URI in proxy_pass, the request is passed on unchanged
        # (no prefix is stripped).
        set $backend backend:8080;
        set $frontend frontend:3000;
        set $keycloak keycloak:8080;

        location /api/ {
            proxy_pass http://$backend;
        }
        # Will be disabled in prod.
        location = /actuator {
            proxy_pass http://$backend;
        }
        location /actuator/ {
            proxy_pass http://$backend;
        }
        # Keycloak serves under /auth itself. Only the avarc realm and the
        # static resources are public; the admin console, the admin API, the
        # master realm and the management port are not routed. See
        # spec/SPEC-auth.md.
        # The bare prefixes would be redirected by nginx; they answer 404.
        location = /auth/realms/avarc {
            return 404;
        }
        location = /auth/resources {
            return 404;
        }
        location /auth/realms/avarc/ {
            proxy_pass http://$keycloak;
        }
        location /auth/resources/ {
            proxy_pass http://$keycloak;
        }
        location /auth/ {
            return 404;
        }
        location / {
            proxy_pass http://$frontend;
        }
    }
}
