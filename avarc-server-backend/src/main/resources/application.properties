spring.application.name=avarc-server-backend
management.endpoints.web.exposure.include=health

# Login at Keycloak, see spec/SPEC-auth.md. The client secret is the file
# /run/secrets/KEYCLOAK_CLIENT_SECRET of the container.
spring.config.import=optional:configtree:/run/secrets/
avarc.auth.public-origin=${PUBLIC_ORIGIN:http://localhost:8080}
avarc.auth.keycloak-url=${avarc.auth.public-origin}/auth/realms/avarc
avarc.auth.keycloak-internal-url=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080/auth/realms/avarc}
avarc.auth.client-id=avarc-web
avarc.auth.client-secret=${KEYCLOAK_CLIENT_SECRET:}
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=AVARC_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# API description and Swagger UI under /api/, served only where a profile
# enables them (dev, stage), see spec/SPEC-backend.md.
avarc.api.version=@project.version@
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api/docs/openapi.json
springdoc.swagger-ui.path=/api/docs

# Database, see spec/SPEC-backend.md. The application's tables live in the
# schema avarc, which Flyway creates; Hibernate only validates the mapping.
# The password is the file /run/secrets/POSTGRES_PASSWORD of the container.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:avarc}
spring.datasource.username=${DB_USER:avarc}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.flyway.schemas=avarc
spring.flyway.create-schemas=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=avarc
spring.jpa.open-in-view=false

# Locations, see spec/SPEC-locations.md: the languages of the content, and
# batch loading of their collections when a page of locations is read.
avarc.locations.languages=en,de
spring.jpa.properties.hibernate.default_batch_fetch_size=50
