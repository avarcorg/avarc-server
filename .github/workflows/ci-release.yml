name: CI Release

# Builds and publishes all four images for a release tag, so that a release
# version names a consistent set. See build-module.yml and
# spec/SPEC-releases.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend, ingress, keycloak]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-module.yml
    with:
      module: ${{ matrix.module }}
    secrets: inherit
