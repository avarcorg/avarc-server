name: CI Release

# Builds and publishes all four images for a release tag, so that a release
# version names a consistent set. See build-module.yml and
# spec/SPEC-releases.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  # A release does not ship a text that is not translated yet.
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-messages.py --complete

  build:
    needs: messages
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend, ingress, keycloak]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-module.yml
    with:
      module: ${{ matrix.module }}
    secrets: inherit
