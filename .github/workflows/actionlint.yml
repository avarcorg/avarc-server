name: actionlint

# Lints the workflow files when one of them changes. The tool and its version
# are in tools/actionlint.sh. See spec/SPEC-code-scanning.md.
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "tools/actionlint.sh"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/**", "tools/actionlint.sh"]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/actionlint.sh
