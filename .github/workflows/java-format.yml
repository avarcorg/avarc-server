name: Java format

# Checks that the backend's Java sources are formatted, when one of them, a
# POM or this workflow changes. The check is in tools/java-format.sh. See
# spec/SPEC-code-scanning.md.
on:
  push:
    branches: [main]
    paths: ["**.java", "**/pom.xml", "pom.xml", ".github/workflows/java-format.yml"]
  pull_request:
    branches: [main]
    paths: ["**.java", "**/pom.xml", "pom.xml", ".github/workflows/java-format.yml"]

permissions:
  contents: read

jobs:
  java-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/java-format.sh check
