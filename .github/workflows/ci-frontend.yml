name: CI Frontend

# Builds and tests the frontend module on pushes to main and pull requests that
# change it (or the shared build files); a push to main also publishes its
# image. See build-module.yml and spec/SPEC-releases.md.
on:
  push:
    branches: [main]
    paths:
      - "avarc-server-frontend/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
      - "tools/publish-images.sh"
      - "tools/check-messages.py"
      - ".github/workflows/build-module.yml"
      - ".github/workflows/ci-frontend.yml"
      - "!**.md"
  pull_request:
    branches: [main]
    paths:
      - "avarc-server-frontend/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
      - "tools/publish-images.sh"
      - "tools/check-messages.py"
      - ".github/workflows/build-module.yml"
      - ".github/workflows/ci-frontend.yml"
      - "!**.md"

permissions:
  contents: read

jobs:
  # The translation files must agree before the module is built.
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-messages.py

  build:
    needs: messages
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-module.yml
    with:
      module: frontend
    secrets: inherit
