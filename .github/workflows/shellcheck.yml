name: ShellCheck

# Lints the shell scripts when one of them (or this workflow) changes. The
# file selection is in tools/shellcheck.sh. See spec/SPEC-code-scanning.md.
on:
  push:
    branches: [main]
    paths: ["**.sh", "tools/hooks/**", ".github/workflows/shellcheck.yml"]
  pull_request:
    branches: [main]
    paths: ["**.sh", "tools/hooks/**", ".github/workflows/shellcheck.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/shellcheck.sh
