name: CI Build

# Builds and tests on every push to main and on pull requests; the images are
# built as well, but only pushes to main and release tags publish them. The
# logic is in the Maven build and tools/publish-images.sh. See
# spec/SPEC-releases.md.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

env:
  # Must match java.version and node.version in the POMs (checked below).
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  NAMESPACE: ghcr.io/avarcorg

permissions:
  contents: read

jobs:
  ci-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: buildpacks/github-actions/setup-pack@v6.2.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # setup-java above caches the Maven repository and the wrapper's Maven
      # distribution. npm's downloads are kept by the Node container in a
      # host directory (docker-node.sh).
      - name: Keep npm's downloads between runs
        run: echo "NPM_CACHE=${HOME}/.npm-docker" >> "${GITHUB_ENV}"
      - uses: actions/cache@v6
        with:
          path: ~/.npm-docker
          key: npm-${{ hashFiles('avarc-server-frontend/package-lock.json') }}
          restore-keys: npm-
      - name: Check the versions against the POMs
        run: |
          # maven.compiler.release is java.version of the POM; java.version itself
          # would be the running JDK's own property.
          test "$(./mvnw -q -pl avarc-server-backend help:evaluate -Dexpression=maven.compiler.release -DforceStdout)" = "${JAVA_VERSION}"
          test "$(./mvnw -q -pl avarc-server-frontend help:evaluate -Dexpression=node.version -DforceStdout)" = "${NODE_VERSION}"
      - run: ./mvnw -B -Pwith-docker -Dimage.namespace="${NAMESPACE}" verify
      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Show the image labels
        if: github.event_name == 'push'
        run: |
          for name in backend frontend ingress keycloak; do
            docker image inspect --format '{{json .Config.Labels}}' "${NAMESPACE}/avarc-${name}:latest" | jq .
          done
      - name: Publish the images
        if: github.event_name == 'push'
        run: tools/publish-images.sh "${NAMESPACE}" "${GITHUB_REF}" "${GITHUB_SHA}"

  # Posts the built commit to a chat channel, as a hint for the deployment
  # side. A separate job, and best effort: without the secret it does nothing,
  # and a failure only shows as a warning, so it never fails the workflow.
  # See spec/SPEC-releases.md.
  notify-chat:
    needs: ci-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'avarcorg/avarc-server'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: {}
    steps:
      - name: Post the commit to the chat channel
        env:
          WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: |
          # No tracing and no echo: the URL stays out of the log.
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::notice::CHAT_WEBHOOK_URL is not set, no notification sent"
            exit 0
          fi
          if ! jq -n --arg sha "${GITHUB_SHA}" \
              '{text: ("avarc-server main " + $sha + " built and published")}' |
              curl --fail --silent --max-time 30 \
                --header 'Content-Type: application/json' --data @- \
                "${WEBHOOK_URL}" > /dev/null; then
            echo "::warning::The notification could not be sent"
          fi
